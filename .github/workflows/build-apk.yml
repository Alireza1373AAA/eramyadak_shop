name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter SDK
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version


      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Configure Gradle mirrors
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/init.gradle.kts" <<'EOF'
          beforeSettings {
              dependencyResolutionManagement {
                  repositories {
                      maven { url = uri("https://maven.aliyun.com/repository/google") }
                      maven { url = uri("https://maven.aliyun.com/repository/central") }
                      google()
                      mavenCentral()
                  }
              }
              pluginManagement {
                  repositories {
                      maven { url = uri("https://maven.aliyun.com/repository/google") }
                      maven { url = uri("https://maven.aliyun.com/repository/central") }
                      maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
          }
          allprojects {
              buildscript {
                  repositories {
                      maven { url = uri("https://maven.aliyun.com/repository/google") }
                      maven { url = uri("https://maven.aliyun.com/repository/central") }
                      maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              buildscript.repositories {
                  maven { url = uri("https://maven.aliyun.com/repository/google") }
                  maven { url = uri("https://maven.aliyun.com/repository/central") }
                  maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF

      - name: Install Android build packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee build-apk.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eramyadak-shop-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eramyadak-shop-build-log
          path: build-apk.log
          if-no-files-found: warn
