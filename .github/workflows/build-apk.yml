name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter SDK
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version


      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Configure Gradle mirrors
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/init.gradle.kts" <<'EOF'
          beforeSettings {
              dependencyResolutionManagement {
                  repositories {
                      google()
                      mavenCentral()
                      maven { url = uri("https://maven.aliyun.com/repository/google") }
                      maven { url = uri("https://maven.aliyun.com/repository/central") }
                  }
              }
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                      maven { url = uri("https://maven.aliyun.com/repository/google") }
                      maven { url = uri("https://maven.aliyun.com/repository/central") }
                      maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
                  }
              }
          }
          allprojects {
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                      maven { url = uri("https://maven.aliyun.com/repository/google") }
                      maven { url = uri("https://maven.aliyun.com/repository/central") }
                      maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
                  }
              }
              buildscript.repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url = uri("https://maven.aliyun.com/repository/google") }
                  maven { url = uri("https://maven.aliyun.com/repository/central") }
                  maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
              }
          }
          EOF

      - name: Install Android build packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build-apk.log

      - name: Publish build failure summary
        if: failure()
        shell: bash
        run: |
          if [ -f build-apk.log ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path("build-apk.log").read_text(errors="replace").splitlines()
          primary_markers = ("* What went wrong:", "Execution failed for task")
          fallback_markers = ("FAILURE: Build failed with an exception.", "ERROR:", "Error:")
          start = next((i for i, line in enumerate(lines) if any(marker in line for marker in primary_markers)), None)
          if start is None:
              start = next((i for i, line in enumerate(lines) if any(marker in line for marker in fallback_markers)), max(0, len(lines) - 160))
          excerpt = lines[max(0, start - 20): min(len(lines), start + 180)]
          Path("build-apk-excerpt.log").write_text("\n".join(excerpt), errors="replace")
          PY
            {
              echo "## APK build failed"
              echo '```'
              cat build-apk-excerpt.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            message="$(python3 - <<'PY'
          from pathlib import Path
          text = Path("build-apk-excerpt.log").read_text(errors="replace")
          text = text[:7000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(text)
          PY
          )"
            echo "::error file=build-apk.log,title=APK build failure::$message"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eramyadak-shop-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eramyadak-shop-build-log
          path: build-apk.log
          if-no-files-found: warn

      - name: Commit failed build log
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          cp build-apk.log ci-logs/latest-build-apk.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/build-log-latest
          git add ci-logs/latest-build-apk.log
          git commit -m "Add latest APK build log [skip ci]" || true
          git push --force origin HEAD:ci/build-log-latest || true
